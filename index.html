<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BingoGO">
<title>BingoGO</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
<header><div><p class="eyebrow">BINGO PARA IPHONE</p><h1>BingoGO</h1></div><button id="themeBtn" class="icon-btn">🌙</button></header>

<section class="panel">
<div class="section-head"><div><h2>Mis cartones</h2><p>Hasta 3 cartones activos a la vez.</p></div><button id="editBtn" class="secondary-btn">Jugar</button></div>
<div id="cardsContainer" class="cards-container"></div>
<div class="card-controls"><button id="addCardBtn" class="primary-btn">+ Añadir cartón</button><button id="removeCardBtn" class="danger-btn">Quitar último</button></div>
</section>

<section class="panel">
<div class="section-head"><div><h2>Número cantado</h2><p>Se marcará en todos los cartones.</p></div><button id="undoBtn" class="secondary-btn compact">Deshacer</button></div>
<div id="numberPad" class="number-pad"></div>
<button id="resetBtn" class="danger-btn full">Reiniciar partida</button>
</section>

<section class="panel stats">
<div><strong id="calledCount">0</strong><span>Cantados</span></div>
<div><strong id="hitCount">0</strong><span>Aciertos</span></div>
<div><strong id="remainingCount">0</strong><span>Por tachar</span></div>
</section>
</div>
<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
